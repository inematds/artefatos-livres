<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITULO}}</title>
<style>
  :root { --bg:#0c0c10; --card:#16161c; --tx:#eee; --mut:#9a9aa6; --am:#FACC15; }
  @media (prefers-color-scheme: light) { :root { --bg:#f7f7f4; --card:#fff; --tx:#14141a; --mut:#5b5b66; } }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--tx); font:16px/1.5 system-ui, sans-serif; padding:24px 16px 96px }
  main { max-width:640px; margin:0 auto }
  h1 { margin:0 0 4px } .sub { color:var(--mut); margin:0 0 20px }
  form { display:grid; gap:8px; background:var(--card); padding:16px; border-radius:12px; margin-bottom:20px }
  input, select { padding:10px 12px; border-radius:10px; border:1px solid #444; background:var(--bg); color:var(--tx); font:inherit; min-width:0 }
  button { padding:10px 16px; border:0; border-radius:10px; background:var(--am); color:#0c0c10; font-weight:700; cursor:pointer }
  table { width:100%; border-collapse:collapse } td, th { text-align:left; padding:8px; border-bottom:1px solid #2a2a30 }
  .n { font-size:40px; font-weight:800; color:var(--am) }
</style>
</head>
<body>
<main>
  <h1>{{TITULO}}</h1>
  <p class="sub">Folha de inscrição: cada pessoa se inscreve uma vez; todos veem a mesma lista.</p>
  <form id="f">
    <input id="nome" placeholder="Seu nome" required maxlength="80">
    <select id="turma"><option>Manhã</option><option>Tarde</option><option>Noite</option></select>
    <button>Quero participar</button>
  </form>
  <p><span class="n" id="total">0</span> inscritos</p>
  <table><thead><tr><th>Nome</th><th>Turma</th></tr></thead><tbody id="tb"></tbody></table>
</main>
<script>
  const ins = () => livre.db("inscritos");
  async function desenhar() {
    const docs = await ins().listar().catch(() => []);
    const tb = document.getElementById("tb"); tb.textContent = "";
    docs.forEach((d) => {
      const tr = document.createElement("tr");
      [d.dados.nome, d.dados.turma].forEach((v) => { const td = document.createElement("td"); td.textContent = v; tr.appendChild(td); });
      tb.appendChild(tr);
    });
    document.getElementById("total").textContent = docs.length;
  }
  document.getElementById("f").onsubmit = async (e) => {
    e.preventDefault();
    const nome = document.getElementById("nome").value.trim();
    const id = nome.toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g, "-").slice(0, 60); // um por pessoa
    livre.definirNome(nome);
    await ins().trocar(id, { nome, turma: document.getElementById("turma").value });
  };
  window.addEventListener("livre:pronto", () => { livre.aoMudar(desenhar); desenhar(); });
</script>
</body>
</html>
